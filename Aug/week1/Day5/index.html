<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <select name="" id="">
        <option value="ind">India</option>
        <option value="chi">China</option>
        <option value="pak">Pakistan</option>
    </select>

    <input type="text" placeholder="Searchlist" list="data-list">


    <datalist id="data-list">
        <option value="sonali"></option>
        <option value="pratikshya"></option>
        <option value="adyashree"></option>
        <option value="anushka"></option>
        <option value="priya"></option>
        <option value="sneha"></option>
    </datalist>

    <br />

    <fieldset>
        <legend>Personal Information</legend><br>
        <label for="name">Name</label><br>
        <input type="text" placeholder="Enter your name" name="name" id="name"><br>
        <label for="age">Age</label><br>
        <input type="text" placeholder="Enter your age" name="age" id="age"><br>
        <label for="email">Email</label><br>
        <input type="email" placeholder="Enter your email" name="email" id="email"><br>
        <label for="password">Password</label><br>
        <input type="password" placeholder="Enter your password" name="password" id="password"><br>
        <textarea name="address" id="address" cols="30" rows="10" placeholder="Enter your address"></textarea><br>
    </fieldset>


    <iframe src="https://www.qlith.com/" frameorder="0" width="50%" height="300px"></iframe>


</body>
</html>
