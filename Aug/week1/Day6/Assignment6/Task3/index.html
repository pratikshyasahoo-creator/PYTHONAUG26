<!Doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Form Design Using HTML</title>
<body>
    <fieldset>
        <legend>Personal Information</legend><br>
        <label for="name">First Name</label>
        <input type="text" placeholder="Enter your First name" name="name" id="name"><br>
        <label for="name">Last Name</label>
        <input type="text" placeholder="Enter your Last name" name="name" id="name"><br>
        <label for="Gender">Gender</label>
        <input type="radio" name="gender" value="male" id="male">
        <label for="male">Male</label>
        <input type="radio" name="gender" value="female" id="female">
        <label for="female">Female</label><br>
        <label for="email">Email</label>
        <input type="email" placeholder="Enter your email" name="email" id="email"><br>
        <label for="Date of Birth">Date of Birth</label>
        <input type="date" name="dob" id="Date of Birth"><br>
        <label for="address">Address</label><br>
        <textarea name="address" id="address" cols="30" rows="10" placeholder="Enter your address"></textarea><br>
        <input type="submit" value="Submit">
    </fieldset>
</body>
</html>
