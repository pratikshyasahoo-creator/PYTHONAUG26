<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1><b>Login form using HTML and CSS</b></h1>
    <h2><b>Sign In</b></h2>
    <h3>sign in With your username and password</h3>
        <form>
        <label for="username">Username</label>  
        <input type="text" placeholder="Enter your username" name="username" id="username" required/>
        <br>
        <label for="password">Password</label>
        <input type="password" placeholder="Enter your password" name="password" id="password" required/>
        <br>
        <button type="submit">Login</button>
        <label for="Not a member"><a href="#">Register Here</a></label>
    </form>
</body>



<body>
    <h1><b>Student Registration Form</b></h1>
        <form>
        <label for="Name">Name</label>
        <input type="text" placeholder="Enter Fullname" name="name" id="name" required/>
        <label for="FatherName">Father's Name</label>
        <input type="text" placeholder="Enter Father's Name" name="father_name" id="father_name" required/>
        <label for="MotherName">Mother's Name</label>
        <input type="text" placeholder="Enter Mother's Name" name="mother_name" id="mother_name" required/>
        <label for="Phone Number">Phone Number</label>
        <input type="number" placeholder="017xxxxxxxx" name="phone" id="phone" required/>
        <label for="email">Email</label>
        <input type="email" placeholder="sample@example.com" name="email" id="email" required/>
        <label for="Gender">Gender</label>
        <input type="radio" name="gender" value="male" id="male">
        <label for="male">Male</label>
        <input type="radio" name="gender" value="female" id="female">
        <label for="female">Female</label>
        <input type="radio" name="gender" value="other" id="other">
        <label for="other">Other</label>
        <label for="Date of Birth">Date of Birth</label>
        <input type="date" name="dob" id="dob" required/>
        <label for="Address">Address</label>
        <textarea placeholder="Street- House- Road" name="address" id="address" required></textarea>
        <label for="Blood Group">Blood Group</label>
        <input type="text" placeholder="Enter your blood group" name="blood_group" id="blood_group" required/>
        <label for="Department">Department</label>
        <input type="radio" name="department" value="CSE" id="cs">
        <label for="cs">CSE</label>
        <input type="radio" name="department" value="EEE" id="eee">
        <label for="eee">EEE</label>
        <input type="radio" name="department" value="BBA" id="bba">
        <label for="bba">BBA</label>
        <input type="radio" name="department" value="C" id="C">
        <label for="C">C</label>
        <input type="radio" name="department" value="C++" id="cpp">
        <label for="cpp">C++</label>
        <input type="radio" name="department" value="JAVA" id="java">
        <label for="java">JAVA</label>
        <input type="radio" name="department" value="AI" id="ai">
        <label for="ai">AI</label>
        <input type="radio" name="department" value="Machine Learning" id="ml">
        <label for="ml">Machine Learning</label>
        <input type="radio" name="department" value="Robotics" id="rob">
        <label for="rob">Robotics</label>
        <label for="photo">Photo</label>
        <input type="file" name="photo" id="photo" accept="image/*" required/>
        <label for="Submit"><a href="#">Submit </a></label>
        <button type="reset">Reset</button>
    </form>
</html>
