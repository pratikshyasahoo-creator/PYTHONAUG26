<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Cards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="cards">

    <div class="card">
      <h2>Assess</h2>
      <p>
        Test your design<br>
        skills and establish<br>
        benchmarks.
      </p>
    </div>

    <div class="card">
      <h2>Learn</h2>
      <p>
        Access a design<br>
        library of course.
      </p>
    </div>

    <div class="card">
      <h2>Showcase</h2>
      <p>
        Every skill you learn is<br>
        automatically recorded<br>
        on profile. Show it off<br>
        and see how you stack<br>
        up to other designers.
      </p>
    </div>

  </section>

</body>
</html>
