<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <style>
        p{
            background-color: yellow;
        }
        h1{
            background-color: green;
        }
        h4{
            background-color: blue;
        }
    </style>

</head>
<body>
    <!--ways to add css--->
    <!-- 1. Inline CSS -->
    <!-- 2. Internal CSS -->
    <!-- 3. External CSS -->

    <h1 style="background-color: red;"> This is a heading </h1>
    <p>This is a paragraph.</p>
    <h4>This is a heading4.</h4>


    <!--selector-->
    <!-- simple selector -->
     <!--
        => id selector
        => class selector
        => tag selector
        => group selector
        => universal selector
     -->

     <p id="paragraph">This is a paragraph with an ID.</p>

     <p class="para-class">This is a paragraph with a class.</p>

     <h5>This is a heading5.</h5>

</body>
</html>
