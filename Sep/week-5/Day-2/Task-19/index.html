<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login & Register</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1 id="title">Login</h1>
            <p id="subtitle">Welcome back! Please login to your account.</p>

            <form id="loginForm">

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email"
                    required
                >

                <div class="password-box">
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Password"
                        required
                    >

                    <button
                        type="button"
                        onclick="togglePassword('loginPassword')"
                    >
                        👁
                    </button>
                </div>

                <button type="submit" class="main-btn">
                    Login
                </button>

            </form>

            <form id="registerForm" class="hidden">

                <input
                    type="text"
                    id="registerName"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Email"
                    required
                >

                <div class="password-box">
                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Password"
                        required
                    >

                    <button
                        type="button"
                        onclick="togglePassword('registerPassword')"
                    >
                        
                    </button>
                </div>

                <div class="password-box">
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm Password"
                        required
                    >

                    <button
                        type="button"
                        onclick="togglePassword('confirmPassword')"
                    >
                        
                    </button>
                </div>

                <button type="submit" class="main-btn">
                    Create Account
                </button>

            </form>


            <p id="message"></p>


            <div class="switch">

                <span id="switchText">
                    Don't have an account?
                </span>

                <button id="switchBtn">
                    Register
                </button>

            </div>

        </div>

    </div>


    <div id="dashboard" class="dashboard hidden">

        <div class="dashboard-card">

            <h1>Welcome!</h1>

            <p id="welcome"></p>

            <button
                class="logout-btn"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
