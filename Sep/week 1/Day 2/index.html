<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Left Login Section -->
        <div class="login-section">

            <h2 class="logo">Lumina</h2>

            <div class="login-content">
                <h1>Welcome back!</h1>
                <p>Pick up where you left off, and keep things moving.</p>

                <form>

                    <input type="email"
                           placeholder="john.doe@gmail.com"
                           required>

                    <div class="password-box">
                        <input type="password"
                               placeholder="••••••••"
                               required>
                        <span>Show</span>
                    </div>

                    <div class="options">
                        <label>
                            <input type="checkbox" checked>
                            Remember me
                        </label>

                        <a href="#">Forgot password?</a>
                    </div>

                    <button type="submit">
                        Log in →
                    </button>

                </form>

                <div class="or">or</div>

                <button class="google-btn">
                    <span>G</span> Continue with Google
                </button>

                <p class="signup">
                    Don't have an Account?
                    <a href="#">Sign up</a>
                </p>

            </div>
        </div>


        <!-- Right Image Section -->
        <div class="image-section">
            <img src="https://images.stockcake.com/public/3/9/0/3909db3c-4ca7-462f-9cd9-a031520b55db_large/adorable-baby-dinosaur-stockcake.jpg" alt="Lumina Illustration">
        </div>

    </div>

</body>
</html>
